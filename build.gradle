buildscript {
    repositories { maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Curse Maven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    flatDir { dirs '../原型模组' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // ForgeGradle remaps the production jars for userdev runs; normal output still does not bundle them.
    implementation fg.deobf('local:[自定义NPC]CustomNPCs-1.20.1-GBPort-Unofficial:1.20.1.20260227')
    implementation fg.deobf('local:[野山梅]ysm:2.6.5-forge+mc1.20.1-release')
    compileOnly fg.deobf('curse.maven:timeless-and-classics-zero-1028108:6518539-sources-6518544')
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

mixin {
    add sourceSets.main, 'customnpcs_ysm_compat.refmap.json'
    config 'customnpcs_ysm_compat.mixins.json'
}

tasks.named('test', Test).configure { useJUnitPlatform() }

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    def props = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                 forge_version: forge_version, forge_version_range: forge_version_range,
                 loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
                 mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
                 mod_description: mod_description]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props + [project: project] }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') { into 'META-INF' }
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
